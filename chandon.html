<!-- CHANDON PAGE -->
<div class="page" id="page-chandon">
  <h2 style="font-family: var(--serif); font-size: 18px; margin-bottom: 20px; color: var(--accent);">Chandon - Câmeras Temporárias BoM</h2>

  <div class="card">
    <div class="card-hd">
      <h3 class="card-title">Dados do Projeto CFTV e Alarme Colégio</h3>
      <button class="btn btn-secondary btn-sm" onclick="exportChandonData()">Exportar</button>
    </div>

    <table class="tbl" id="chandon-table">
      <thead id="chandon-thead"></thead>
      <tbody id="chandon-tbody"></tbody>
    </table>
  </div>

  <div class="note-box green" style="margin-top: 20px;">
    <span>Dados carregados do arquivo: <strong>Chandon Câmeras Temporárias BoM.xlsx</strong></span>
  </div>
</div>

<script>
async function loadChandonData() {
  try {
    const response = await fetch('dados_chandon.json');
    const data = await response.json();

    renderChandonTable(data.dados);
  } catch (error) {
    console.error('Erro ao carregar dados Chandon:', error);
    document.getElementById('chandon-tbody').innerHTML = '<tr><td colspan="100%">Erro ao carregar dados</td></tr>';
  }
}

function renderChandonTable(dados) {
  if (!dados || dados.length === 0) {
    document.getElementById('chandon-tbody').innerHTML = '<tr><td colspan="100%">Nenhum dado disponível</td></tr>';
    return;
  }

  // Cria cabeçalho
  const thead = document.getElementById('chandon-thead');
  const colunas = Object.keys(dados[0]);
  let headerHTML = '<tr>';
  colunas.forEach(col => {
    headerHTML += `<th>${col}</th>`;
  });
  headerHTML += '</tr>';
  thead.innerHTML = headerHTML;

  // Cria linhas
  const tbody = document.getElementById('chandon-tbody');
  let bodyHTML = '';
  dados.forEach(row => {
    bodyHTML += '<tr>';
    colunas.forEach(col => {
      const valor = row[col] || '';
      bodyHTML += `<td>${valor}</td>`;
    });
    bodyHTML += '</tr>';
  });
  tbody.innerHTML = bodyHTML;
}

function exportChandonData() {
  // Simples export para Excel usando XLSX
  const table = document.getElementById('chandon-table');
  const wb = XLSX.utils.table_to_book(table);
  XLSX.writeFile(wb, 'Chandon_Dados.xlsx');
}

// Carrega dados quando a página do Chandon é ativada
document.addEventListener('DOMContentLoaded', function() {
  // Observa mudanças na aba
  const observer = new MutationObserver(function() {
    const chandonPage = document.getElementById('page-chandon');
    if (chandonPage && chandonPage.classList.contains('active')) {
      loadChandonData();
    }
  });

  observer.observe(document.getElementById('content'), {
    childList: true,
    subtree: true,
    attributes: true
  });
});
</script>
